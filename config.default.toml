# Defaults for every key. The user config (~/.config/edge-shell/config.toml) is overlaid on this.
# A monitor that is not listed behaves as shell = "plasma" (Edge Shell builds nothing there).

[theme]
frame = "#0b0c0d"
text = "#e6e8ea"
text_secondary = "#9ba0a6"
accent = "#8fd3b6"
handle = "#7b7f84"
handle_hover = "#e6e8ea"
surface_hover = "#1d2024"
thickness = 10      # T, px, 5-64
radius = 14         # R, px
peek = 14           # hover peek depth, px
hover_zone = 16     # invisible hover target past the frame, px
duration_ms = 280
fade_ms = 50        # fade in/out of a monitor's Edge Shell, 0-500 ms; 0 = no fade
font = ["Hack Nerd Font Mono", "JetBrains Mono", "monospace"]

# Border around the outside of the frame and panel outline (spec section 18). Opt-in.
# It adds to the frame: a 10 px frame with a 4 px border covers 14 px (the frame band itself,
# panel depth and layout rules stay as configured; maximized windows stop at the outer edge).
[theme.border]
enabled = false
width = 2               # px, drawn on the desktop side of the outline
color = "#8fd3b6ff"     # #rrggbb or #rrggbbaa (the alpha makes it translucent)

# Uniform shadow of the frame and panels onto the desktop. Opt-in.
[theme.shadow]
enabled = false
elevation = 50          # 0-100 %; 100 % reaches 48 px
color = "#00000080"     # #rrggbb or #rrggbbaa; the alpha is the shadow's strength

# Handle look of every panel (spec 15); a panel entry's `handle` table overrides it, and the
# colours are `handle` and `handle_hover` above. Per monitor: [monitors.NAME.theme.handle_style].
[theme.handle_style]
shape = "auto"          # auto | dots | bar | chevron | none; auto follows the interactions
size = 15               # px along the edge, 4-40
weight = 3              # px, 1-8: dot diameter, bar and chevron thickness

# Panel layout (spec 16-17). `gap` is the straight piece of frame left between two neighbouring
# panels on one edge, on top of their curved joins (so any value keeps the minimum the outline
# needs). Per monitor: [monitors.NAME.layout].
[layout]
gap = 8
