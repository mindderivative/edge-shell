name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for pycairo
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config
      # This list mirrors the pyproject dependencies and must be kept in sync with them.
      - name: Install (no GTK; gi/fabric tests skip themselves)
        run: pip install "pydantic>=2.6" pycairo "tomlkit>=0.15" pytest "ruff==0.17.0"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
